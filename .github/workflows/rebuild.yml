name: Weekly rebuild (next seminar rollover)

on:
  schedule:
    # 15:10 Madrid time every day (13:10 UTC in summer, 14:10 UTC in winter).
    # Two entries so it fires at the right local time in both DST regimes.
    - cron: "10 13 * * *"
    - cron: "10 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python build.py
      - name: Commit and push if the home page changed
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "No change on the home page; nothing to publish."
            exit 0
          fi
          git config user.name "ieerg-bot"
          git config user.email "actions@github.com"
          git add docs
          git commit -m "Automatic rebuild: next seminar rollover"
          git push
